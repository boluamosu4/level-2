<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | BobForge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark-custom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-uppercase fs-3" href="index.html">
        Bob<span class="text-red">Forge</span>
      </a>
      <button class="btn btn-outline-light border-0 ms-auto me-2" type="button" onclick="toggleTheme()" id="themeToggle" aria-label="Switch to dark mode" title="Switch to dark mode">
        <i class="fa-solid fa-sun" aria-hidden="true"></i>
      </button>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link text-uppercase" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-uppercase" href="index.html">Store</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-uppercase" href="index.html">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-uppercase" href="#" data-bs-toggle="modal" data-bs-target="#contactModal">Support</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <a class="btn btn-outline-light" href="index.html">Sign In</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold text-uppercase mb-3">Create an Account</h3>
            <form id="signupForm" onsubmit="handleSignUp(event)">
              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="signupName" class="form-control" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" id="signupEmail" class="form-control" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                  <input type="password" id="signupPassword" class="form-control" required />
                  <button type="button" class="btn btn-outline-secondary" id="toggleSignupPassword" onclick="togglePasswordVisibility('signupPassword', 'toggleSignupPassword')" aria-label="Show password" title="Show password">
                    <i class="fa-solid fa-eye" aria-hidden="true"></i>
                  </button>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <div class="input-group">
                  <input type="password" id="signupPasswordConfirm" class="form-control" required />
                  <button type="button" class="btn btn-outline-secondary" id="toggleSignupPasswordConfirm" onclick="togglePasswordVisibility('signupPasswordConfirm', 'toggleSignupPasswordConfirm')" aria-label="Show password" title="Show password">
                    <i class="fa-solid fa-eye" aria-hidden="true"></i>
                  </button>
                </div>
              </div>
              <button type="submit" class="btn btn-red w-100 text-uppercase fw-bold">Create Account</button>
            </form>
            <div class="text-center mt-3 small">
              Already have an account? <a href="index.html">Sign in</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Contact Modal (same as index) -->
  <div class="modal fade" id="contactModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content border-0">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title text-uppercase fw-bold">Contact Support</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <p class="mb-3">Founder: <strong>AMOSUN BOLUWATIFE JAMES</strong></p>
          <p class="mb-3">Support Email: <a href="mailto:boluamosu4@gmail.com">boluamosu4@gmail.com</a></p>
          <form id="contactFormPage" onsubmit="handleContactSubmit(event)">
            <div class="mb-3">
              <label class="form-label">Your Name</label>
              <input id="contactName" type="text" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Your Email</label>
              <input id="contactEmail" type="email" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea id="contactMessage" class="form-control" rows="4" required></textarea>
            </div>
            <div class="d-flex justify-content-end">
              <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Close</button>
              <button type="submit" class="btn btn-red">Send Message</button>
            </div>
          </form>
          <div class="mt-3 social-icons">
            <a href="https://wa.me/2349012521735" target="_blank" rel="noreferrer" aria-label="WhatsApp" title="WhatsApp: 09012521735" class="me-2">
              <i class="fa-brands fa-whatsapp"></i>
            </a>
            <a href="tel:+2349035916140" aria-label="Call" title="Call: 09035916140" class="me-2">
              <i class="fa-solid fa-phone"></i>
            </a>
            <a href="https://www.tiktok.com/@bobtizzy4" target="_blank" rel="noreferrer" aria-label="TikTok" title="TikTok: Bobtizzy">
              <i class="fa-brands fa-tiktok"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="py-4 mt-5 bg-dark text-white">
    <div class="container d-flex justify-content-between align-items-center">
      <div>
        <div class="fw-bold">BobForge</div>
        <div class="small">Founder: AMOSUN BOLUWATIFE JAMES</div>
      </div>
      <div class="text-end small">
        Support: <a href="mailto:boluamosu4@gmail.com" class="text-decoration-underline text-white">boluamosu4@gmail.com</a>
      </div>
    </div>
  </footer>
  <!-- Notification container -->
  <div id="notificationContainer" class="position-fixed top-0 end-0 p-3" style="z-index:1080;"></div>

  <script src="https://js.paystack.co/v1/inline.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
